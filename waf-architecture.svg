<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Web Application Firewall Lab — Architecture</text>

  <!-- Kali -->
  <rect x="40" y="80" width="150" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="115" y="105" text-anchor="middle" font-size="13" font-weight="bold">Kali Linux</text>
  <text x="115" y="122" text-anchor="middle" font-size="11">192.168.100.20</text>

  <!-- WAF proxy -->
  <rect x="300" y="80" width="180" height="80" rx="6" fill="#eaf2fd" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="390" y="103" text-anchor="middle" font-size="13" font-weight="bold">Flask WAF Proxy</text>
  <text x="390" y="119" text-anchor="middle" font-size="11">:80 — signature rules +</text>
  <text x="390" y="133" text-anchor="middle" font-size="11">rate limiting</text>
  <text x="390" y="150" text-anchor="middle" font-size="10" fill="#555">192.168.100.40</text>

  <!-- DVWA -->
  <rect x="620" y="80" width="150" height="60" rx="6" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>
  <text x="695" y="105" text-anchor="middle" font-size="13" font-weight="bold">DVWA (Docker)</text>
  <text x="695" y="122" text-anchor="middle" font-size="11">:8080</text>

  <!-- arrows: request path -->
  <line x1="190" y1="110" x2="298" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="244" y="100" text-anchor="middle" font-size="10">HTTP request</text>

  <line x1="480" y1="100" x2="618" y2="100" stroke="#1e8449" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="549" y="90" text-anchor="middle" font-size="10" fill="#1e8449">clean → forward</text>

  <line x1="618" y1="130" x2="480" y2="130" stroke="#1e8449" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="549" y="147" text-anchor="middle" font-size="10" fill="#1e8449">DVWA response</text>

  <!-- block branch -->
  <rect x="300" y="210" width="180" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="390" y="235" text-anchor="middle" font-size="12" font-weight="bold">Blocked</text>
  <text x="390" y="252" text-anchor="middle" font-size="11">403 / 429 response</text>
  <line x1="390" y1="160" x2="390" y2="208" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="190" text-anchor="middle" font-size="10" fill="#c0392b">malicious pattern</text>

  <!-- log file -->
  <rect x="300" y="320" width="180" height="60" rx="6" fill="#fff8e1" stroke="#b7950b" stroke-width="1.5"/>
  <text x="390" y="345" text-anchor="middle" font-size="12" font-weight="bold">waf_blocks.log</text>
  <text x="390" y="362" text-anchor="middle" font-size="11">structured JSON</text>
  <line x1="390" y1="270" x2="390" y2="318" stroke="#b7950b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Wazuh agent -->
  <rect x="300" y="430" width="180" height="60" rx="6" fill="#eaf2fd" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="390" y="455" text-anchor="middle" font-size="12" font-weight="bold">Wazuh Agent</text>
  <text x="390" y="472" text-anchor="middle" font-size="11">"waf-lab"</text>
  <line x1="390" y1="380" x2="390" y2="428" stroke="#b7950b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Wazuh manager + dashboard -->
  <rect x="600" y="430" width="220" height="80" rx="6" fill="#f4ecf7" stroke="#6c3483" stroke-width="1.5"/>
  <text x="710" y="453" text-anchor="middle" font-size="12" font-weight="bold">Wazuh Manager</text>
  <text x="710" y="469" text-anchor="middle" font-size="11">rules 100110–100114</text>
  <text x="710" y="485" text-anchor="middle" font-size="11">→ Threat Hunting alert</text>
  <text x="710" y="500" text-anchor="middle" font-size="10" fill="#555">192.168.100.10</text>
  <line x1="480" y1="460" x2="598" y2="460" stroke="#6c3483" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="450" y="540" text-anchor="middle" font-size="11" fill="#555">Same host-only lab network (192.168.100.0/24) used across the honeypot, SIEM, and WAF projects</text>
</svg>
